[project]
name = "rag-bot"
version = "0.1.0"
description = "RAG customer support bot — Python / LangChain implementation"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-pinecone>=0.2",
    "pinecone>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bot"]

[tool.ruff]
line-length = 100
